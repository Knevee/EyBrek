<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;" />
  <title>EyBrek - Descanso</title>
  <link rel="stylesheet" href="../../node_modules/@fontsource/patrick-hand/latin-400.css" />
  <link rel="stylesheet" href="css/bloqueo.css" />
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-ojo" viewBox="0 0 24 24">
      <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z" />
      <circle cx="12" cy="12" r="2.6" />
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2" />
    </symbol>
    <symbol id="i-sol" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6" />
    </symbol>
    <symbol id="i-circulos" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8" />
      <path d="M12 4a8 8 0 0 1 0 16" stroke-width="3" />
    </symbol>
    <symbol id="i-manos" viewBox="0 0 24 24">
      <path d="M4 13c0-2 1-3 2.5-3S9 11 9 13v3.5c0 2-1.4 3.5-3.2 3.5S4 18.5 4 16.5V13Z" />
      <path d="M9 13c0-2 1-3 2.5-3S14 11 14 13v3c0 2-1.4 3.5-3.2 3.5S9 18 9 16V13Z" />
      <path d="M14 13c0-2 1-3 2.5-3S19 11 19 13v3c0 2-1.4 3.5-3.2 3.5S14 18 14 16V13Z" />
    </symbol>
    <symbol id="i-corazon" viewBox="0 0 24 24">
      <path d="M12 20.5S3.5 15.5 3.5 9.4A4.9 4.9 0 0 1 12 6.3a4.9 4.9 0 0 1 8.5 3.1c0 6.1-8.5 11.1-8.5 11.1Z" />
    </symbol>
    <symbol id="i-reloj" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3.2 2" />
    </symbol>
  </defs>
</svg>

<main class="bloqueo">
  <!-- ---- Columna izquierda: el descanso ---- -->
  <section class="panel-descanso">
    <div class="panel-contenido">
      <svg class="icono-grande"><use href="#i-ojo"></use></svg>

      <p class="etiqueta" id="etiqueta-descanso">Es momento de una pausa</p>

      <p class="reloj" id="reloj">00:00</p>

      <p class="fecha" id="fecha"></p>

      <p class="chip-fin">
        <svg class="icono"><use href="#i-reloj"></use></svg>
        <span id="texto-fin">El descanso termina pronto</span>
      </p>

      <p class="lema" id="lema">Descansa hoy, para ver un mejor mañana</p>

      <p class="restante" id="restante"></p>

      <div class="gato">
        <img src="../../assets/gato-mimido.png" alt="Gato descansando" />
      </div>
    </div>
  </section>

  <!-- ---- Columna derecha: el ejercicio ---- -->
  <section class="panel-ejercicio">
    <div class="tarjeta-ejercicio">
      <span class="sprout" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21c0-7 4-13 10-15 1 8-2 14-8 15Z" /><path d="M12 21C9 16 6 14 2 13" /></svg>
      </span>

      <h1>Ejercicios para tus ojos</h1>
      <p class="subtitulo">Sigue cada paso con calma y sin forzar la vista</p>

      <div class="divisor"><span class="corazon">&#9829;</span></div>

      <p class="contador" id="contador">Ejercicio 1 de 4</p>

      <p class="temporizador" id="temporizador">00:20</p>

      <h2 class="titulo-ejercicio" id="titulo-ejercicio">Cerca y lejos</h2>
      <p class="instrucciones" id="instrucciones">Mira tu pulgar 5 segundos y luego algo lejano.</p>

      <p class="siguiente" id="siguiente">Siguiente: Parpadeo</p>

      <div class="progreso" id="progreso" aria-hidden="true"></div>

      <div class="lista" id="lista"></div>

      <p class="consejo" id="consejo" hidden></p>
    </div>
  </section>
</main>

<script src="js/bloqueo.js"></script>
</body>
</html>
